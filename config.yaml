# Configuration file for Federated Proximal Gating with Data Quality
# You can override any of these parameters by editing this file.
# Command-line arguments take precedence over these values.

experiments:
  - dataset: "adult"
    n_rounds: 500
    local_epochs: 500
    lr: 0.0015
    mu: 0.5
    eta: 1.01
    target_column: ""
    splitting_perc_train_test: 0.8
    splitting_perc_test_val: 0.5

  - dataset: "diabates"
    n_rounds: 500
    local_epochs: 500
    lr: 0.05
    mu: 0.001
    eta: 1.01
    target_column: ""
    splitting_perc_train_test: 0.8
    splitting_perc_test_val: 0.5

data_poisoning:
  methods: ["clean", "noise", "flipping", "nan", "all"]
  features_percentage: [0.2, 0.4, 0.6, 0.8]
  poisoning_percentage: [0.2, 0.4, 0.6, 0.8]

models: ["mlp", "linear"]
frogdq_modes: ["none", "inertia", "gaussian", "dirichlet"]
seeds: [42, 56, 221, 800, 1258, 2, 121, 4200, 444, 500]
    

  



  
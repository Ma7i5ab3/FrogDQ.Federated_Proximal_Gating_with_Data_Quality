# Configuration file for Federated Proximal Gating with Data Quality
# You can override any of these parameters by editing this file.
# Command-line arguments take precedence over these values.

experiments:
  - name: "Experiment 1"
    K: 10
    N: 50
    D: 5
    n_rounds: 300
    local_epochs: 10
    lr: 0.005
    mu: 0.5
    n_corrupt: 1
    model_type: "logreg"
    
    #Logistic Regression Params
    synthetic_data: True
    noise_std_syn: 0.5
    noise_std_poisoning: 0.8
    missing: True
    #Neural Network Params
    dataset_path: ""
    target_column: ""
    num_classes: 2

    #Plot Params
    n_feature_show: 5


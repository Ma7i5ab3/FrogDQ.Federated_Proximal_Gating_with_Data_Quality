    frog_temp_tau: 2.0
    frog_temp_eta: 1.01
    target_column: ""
    splitting_perc_train_test: 0.8
    splitting_perc_test_val: 0.5

  - dataset: "iris"
    n_rounds: 500
    local_epochs: 500
    lr: 0.001
    lambda_prox: 0.1
    frog_temp_tau: 2.0
    frog_temp_eta: 1.01
    target_column: ""

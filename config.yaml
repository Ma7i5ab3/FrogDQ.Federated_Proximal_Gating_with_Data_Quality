# Configuration file for Federated Proximal Gating with Data Quality
# You can override any of these parameters by editing this file.
# Command-line arguments take precedence over these values.

experiments:
  - dataset: "adult"
    n_rounds: 500
    local_epochs: 500
    lr: 0.00015
    lambda_prox: 0.1
    frog_temp_tau: 2.0
    frog_temp_eta: 1.01
    target_column: ""
    splitting_perc_train_test: 0.8
    splitting_perc_test_val: 0.5

  - dataset: "heart"
    n_rounds: 500
    local_epochs: 500
    lr: 0.001
    lambda_prox: 0.1
    frog_temp_tau: 2.0
    frog_temp_eta: 1.01
    target_column: ""
    splitting_perc_train_test: 0.8
    splitting_perc_test_val: 0.5

  - dataset: "breast_cancer"
    n_rounds: 500

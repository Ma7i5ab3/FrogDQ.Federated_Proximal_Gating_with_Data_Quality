    frog_temp_tau: 2.0
    frog_temp_eta: 1.01
    target_column: ""
    splitting_perc_train_test: 0.8
    splitting_perc_test_val: 0.5

data_poisoning:
  methods: ["noise", "flipping", "nan", "all"]
  features_percentage: [0.1, 0.2, 0.4, 0.6, 0.8]
  poisoning_percentage: [0.1, 0.2, 0.4, 0.6, 0.8]

models: ["mlp", "linear"]
frogdq_modes: ["none", "temp_cos", "temp", "inertia", "gaussian", "dirichlet"]
seeds: [42, 56, 221, 800, 1258, 2, 121, 4200, 444, 500]
    

  



  
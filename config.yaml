# FrogDQ Hyperparameter Optimization Configuration
# =================================================
# This file configures the Optuna-based hyperparameter optimization experiments
# for testing model performance across different configurations.

# Experiment Settings
# -------------------

# Datasets to run experiments on
# Options:
#   - 'all': Run on all available datasets from data/ directory
#   - List of dataset names: e.g., ['iris', 'wine', 'adult']
# To see available datasets, run: python -c "from frogdq.data import get_datasets; print(get_datasets())"

# datasets: ['iris']

# (ALL DATASETS)
# datasets: ['iris', 'breast_cancer_wisconsin_diagnostic', 'bank_marketing', 'adult', 'wine', 'car_evaluation', 'predict_students_dropout_and_academic_success', 'default_of_credit_card_clients', 'mushroom', 'statlog_german_credit_data', 'estimation_of_obesity_levels_based_on_eating_habits_and_physical_condition', 'spambase', 'online_shoppers_purchasing_intention_dataset', 'magic_gamma_telescope', 'breast_cancer_wisconsin_original', 'breast_cancer', 'dry_bean', 'heart_failure_clinical_records', 'credit_approval', 'chronic_kidney_disease', 'wholesale_customers', 'seoul_bike_sharing_demand', 'rice_cammeo_and_osmancik', 'optical_recognition_of_handwritten_digits', 'glass_identification', 'zoo', 'higher_education_students_performance_evaluation', 'maternal_health_risk', 'early_stage_diabetes_risk_prediction', 'letter_recognition', 'national_poll_on_healthy_aging_npha', 'hepatitis', 'aids_clinical_trials_group_study_175', 'iranian_churn']

# (REGRESSION DATASETS)
# datasets: ['heart_disease', 'wine_quality', 'automobile', 'abalone', 'bike_sharing', 'auto_mpg', 'forest_fires', 'real_estate_valuation', 'concrete_compressive_strength', 'parkinsons', 'phishing_websites', 'appliances_energy_prediction', 'banknote_authentication', 'productivity_prediction_of_garment_employees', 'combined_cycle_power_plant', 'liver_disorders']

# (CLASSIFICATION DATASETS)
# datasets: ['breast_cancer_wisconsin_original', 'chronic_kidney_disease', 'dry_bean', 'glass', 'heart_failure', 'hepatitis', 'higher_education_students_performance_evaluation']

# Datasets 001-068
datasets:
  - dna
  - phishingwebsites


# Data quality modes to test
# Options: 'clean', 'ar' (At Random poisoning), 'nar' (Not At Random poisoning)
data_modes:
  - clean
  - ar
  - nar

# Model architectures to test
# Options: 'linear' (no hidden layers), 'mlp' (multi-layer perceptron)
model_types:
  - mlp

# Curriculum learning settings to test
# true: Enable curriculum learning (prioritize high-quality samples)
# false: Standard random sampling
curriculum_settings:
  - false
  - true

# Gate layer settings to test
# true: Enable learnable input gate layer
# false: No gating
gate_settings:
  - false
  - true

# Data Split Settings
# -------------------

# Fraction of each dataset held out as the clean test set.
# Must be identical in poison_data.py and autogluon.py — both scripts read
# this value from here so it never needs to be set manually in two places.
test_size: 0.3

# Whether to use clean validation data even when training on poisoned data
# true: Always validate on clean data (recommended for measuring real performance)
# false: Use same mode as training data
clean_val: false

# Whether to use clean test data even when training on poisoned data
# true: Always test on clean data (recommended for final evaluation)
# false: Use same mode as training data
clean_test: true

# Optuna Settings
# ---------------

# Number of Optuna trials per configuration
# Each trial tests a different hyperparameter combination
n_trials: 256

# Number of random seeds to evaluate per trial
# The best hyperparameters are those with the best average validation metric
n_seeds: 10

# Starting seed for incremental seed generation
# Seeds will be: seed_start, seed_start+1, seed_start+2, ...
seed_start: 42

# Number of top trials to log (with all seeds)
# The top-M trials will be saved with full train/val/test metrics
top_m: 10

# Parallel Processing
# -------------------

# Number of parallel jobs for evaluating seeds within each trial
# Higher values = faster per trial, but more CPU/memory usage
# Set to 1 for debugging, or number of CPU cores for speed
n_jobs_seeds: 16

# Random seed for Optuna sampler (for reproducibility)
# This ensures the hyperparameter sampling order is deterministic
optuna_sampler_seed: 42

n_jobs_optuna: 16

# Warm Start / Resume Settings
# ----------------------------

# Whether to resume from previous incomplete runs
# true: Load existing studies from database and resume from last checkpoint
#       - Skips completed studies (n_trials reached)
#       - Continues incomplete studies from last trial
#       - Creates new study if not found
# false: Always start fresh (ignores any previous runs)
warm_start: true

# Reuse Parameter Settings
# ------------------------------
# Whether to reuse best hyperparameters
# for training on poisoned data.
# true: Sample hyperparameters from top-N trials
# false: Do not reuse parameters
reuse_params: true

# Number of top trials to sample from when reusing parameters
reuse_top_n: 8

# AutoGluon Benchmark Settings
# -----------------------------

# Whether to include AutoGluon as a data-preparation benchmark.
# When true, Optuna experiments are also run on AR/NAR modes using pre-computed
# AutoGluon-transformed features (no further preprocessing inside the experiment).
# These act as baselines: linear and MLP models trained on AutoGluon features.
#
# IMPORTANT: run the preparation script first:
#   python scripts/autogluon.py [--datasets ...] [--data-modes ar nar]
#
# false: skip AutoGluon benchmark (default)
# true:  include AutoGluon benchmark experiments
run_autogluon: false

# Directory containing pre-computed AutoGluon features produced by scripts/autogluon.py.
# Structure: data_autogluon/{mode}/{model_type}/{dataset_name}/seed_{seed}.npz
autogluon_data_dir: data_autogluon

# Custom Pipeline (CP) Benchmark Settings
# -----------------------------------------
# Whether to include the custom pipeline (CP) as a data-preparation benchmark.
# Requires running scripts/data_preparation_pipeline.py first.
# false: skip CP benchmark (default)
# true:  include CP benchmark experiments
run_cp: true

# Directory containing CP-cleaned data produced by scripts/data_preparation_pipeline.py.
# Structure: data_cleaned_cp/{mode}/{dataset_filename}.csv
cp_data_dir: data_cleaned_cp

# Saga++ Benchmark Settings
# --------------------------
# Whether to include Saga++ as a data-preparation benchmark.
# Requires running scripts/saga.py first.
# false: skip Saga benchmark (default)
# true:  include Saga benchmark experiments
run_saga: true

# Directory containing Saga++-cleaned data produced by scripts/saga.py.
saga_data_dir: data_cleaned_saga

# Baseline 0 (Zero/Random Imputation) Benchmark Settings
# --------------------------------------------------------
# Whether to include Baseline 0 as a data-preparation benchmark.
# Numerical NaN → 0; categorical NaN → random observed value.
# Requires running scripts/baseline_zero.py first.
run_baseline_zero: false

# Directory containing Baseline-0-imputed data produced by scripts/baseline_zero.py.
baseline_zero_data_dir: data_baseline_zero

# KNN Imputation Benchmark Settings
# -----------------------------------
# Whether to include KNN imputation as a data-preparation benchmark.
# Requires running scripts/knn.py first.
run_knn: false

# Directory containing KNN-imputed data produced by scripts/knn.py.
knn_data_dir: data_knn

# Gate + Curriculum Experiment Settings
# ---------------------------------------
# Whether to include the combined gate+curriculum experiment.
# true:  run gate+curriculum (default)
# false: skip gate+curriculum
run_gate_curriculum: false

# Data Poisoning Settings
# -----------------------
# Parameters controlling how AR and NAR poisoning are applied.
# All values here are the defaults used by scripts/poison_data.py.
# CLI flags (--mild-rate, --no-ar-numerical, etc.) override these when passed.
poisoning:

  # Noise distribution tiers.
  # Each tier defines the fraction of columns assigned to that severity and
  # the per-column corruption rate (0–1).
  # mild_frac is computed automatically as 1 - moderate_frac - heavy_frac - severe_frac.
  noise:
    # Fraction of feature columns kept completely unpoisoned (0.0–1.0).
    # 0.0 = all features may be poisoned (current behaviour).
    # e.g. 0.3 = 30 % of columns are randomly selected and never touched.

    clean_feature_frac: 0.4

    mild_rate: 0.06
    moderate_frac: 0.30
    moderate_rate: 0.15
    heavy_frac: 0.15
    heavy_rate: 0.35
    severe_frac: 0.10
    severe_rate: 0.50

  # AR (At Random) poisoning mechanisms.
  # Set to false to disable a specific mechanism.
  ar:
    enable_numerical_noise: true    # Additive Gaussian noise on numerical features
    enable_categorical_flips: true  # Random label flips for categorical features
    enable_missing: true            # MCAR: Missing Completely At Random

  # NAR (Not At Random) poisoning mechanisms.
  # Set to false to disable a specific mechanism.
  nar:
    enable_nnar: true             # Heteroscedastic noise (value-dependent magnitude)
    enable_mnar: true             # Extreme values more likely to be missing
    enable_systematic_flips: true # Systematic categorical confusion patterns
    enable_correlated_noise: true # Correlated noise propagation across features
    enable_rare_missing: true     # Rare categories more likely to be missing
    min_corruption: 0.25          # Minimum total cell corruption rate (floor)
    max_corruption: 0.50          # Maximum total cell corruption rate (cap)

# Output Settings
# ---------------

# Directory to save results
output_dir: results

# Whether to save training histories as .npz files
# true: Save detailed per-trial and top-M histories to .npz files
# false: Skip saving .npz files (saves disk space)
save_npz_histories: false

# Verbosity level
# 0: Silent (only errors)
# 1: Progress bars and summary (recommended)
# 2: Detailed output per trial
verbose: 1

# Hyperparameter Ranges
# ---------------------
# You can customize the search space for hyperparameters
# Format: [min, max] for ranges, or list of choices for categorical

hyperparameter_ranges:
  # Common hyperparameters (linear and MLP)
  epochs: [256, 256]
  batch_size_choices: [64, 128, 256]
  learning_rate: [0.0005, 0.05, 'log']  # 'log' for log-uniform sampling
  optimizer_choices: ['adam', 'adamw', 'sgd']
  weight_decay: [0.000001, 0.01, 'log']
  early_stopping_patience: [16, 16]
  lr_scheduler_choices: ['none', 'plateau', 'cosine', 'step']

  # MLP-specific hyperparameters
  hidden_neurons_choices: [4, 8, 16, 32, 64]
  num_layers: [1, 4]
  dropout: [0.0, 0.5]
  activation_choices: ['relu', 'gelu', 'elu']
  use_batch_norm: [true, false]

  # Curriculum learning hyperparameters
  curriculum_strategy_choices: ['linear', 'exponential', 'step']

  # Gate layer hyperparameters
  gate_init_choices: ['quality'] # ['random', 'ones', 'quality']
  gate_loss_weight: [0.0001, 0.1, 'log']
  gate_anchor_interval: [1, 20]
  gate_quality_weighting_choices: ['linear', 'quadratic', 'exp', 'inv_exp']
  gate_loss_scheduler_choices: ['none', 'decay', 'cosine']
